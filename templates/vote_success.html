
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vote Submitted | SmartVote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f3f6fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .success-card {
            background: white;
            border-radius: 18px;
            padding: 45px 30px;
            max-width: 520px;
            width: 92%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }
        .success-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #d1e7dd;
            color: #198754;
            font-size: 42px;
            line-height: 75px;
            margin: 0 auto 22px;
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="success-icon">✓</div>
    <h2 class="text-success">Vote Submitted Successfully!</h2>
    <p class="text-muted mt-3">
        Your vote has been recorded successfully.
        Thank you for participating.
    </p>
    <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary mt-3">
        Return to Dashboard
    </a>
</div>

</body>
</html>
