
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTP Verification | SmartVote</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #edf2f9;
            font-family: Arial, sans-serif;
        }

        .otp-card {
            max-width: 440px;
            margin: 110px auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h2 {
            color: #193c6b;
            font-weight: bold;
        }

        .otp-input {
            letter-spacing: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="otp-card">

        <h2 class="text-center">OTP Verification</h2>

        <p class="text-center text-muted">
            Enter the 6-digit OTP received through the voice call
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.verify_otp') }}">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="mb-4">
                <label class="form-label">
                    Enter 6-digit OTP
                </label>

                <input
                    type="text"
                    name="otp"
                    class="form-control otp-input"
                    placeholder="------"
                    maxlength="6"
                    minlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required
                    autofocus
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Verify OTP
            </button>

        </form>

        <p class="text-center text-muted mt-3 mb-0">
            OTP is valid for 5 minutes.
        </p>

        <p class="text-center mt-3">
            <a href="{{ url_for('auth.logout') }}">
                Cancel and go back to login
            </a>
        </p>

    </div>

</div>

</body>
</html>
